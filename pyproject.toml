[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CustomPlots"
version = "0.2.0"
description = "Nicer-looking charts than pandas' defaults, in one import."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CustomPlots contributors" }]
keywords = ["visualization", "matplotlib", "pandas", "charts", "plotting"]
dependencies = [
    "matplotlib>=3.5",
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/nahmedi286179/vis"

[tool.setuptools]
packages = ["CustomPlots"]
